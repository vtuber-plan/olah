[basic]
host = "localhost"
port = 8090
ssl-key = ""
ssl-cert = ""
repos-path = "./repos"
cache-size-limit = ""
cache-clean-strategy = "LRU"
hf-scheme = "https"
hf-netloc = "huggingface.co"
hf-lfs-netloc = "cdn-lfs.huggingface.co"
mirror-scheme = "http"
mirror-netloc = "localhost:8090"
mirror-lfs-netloc = "localhost:8090"
mirrors-path = ["./mirrors_dir"]

[accessibility]
offline = false

# allow other or will be in whitelist mode.
[[accessibility.proxy]]
repo = "*"
allow = true

[[accessibility.proxy]]
repo = "*/*"
allow = true

[[accessibility.proxy]]
repo = "cais/mmlu"
allow = true

[[accessibility.proxy]]
repo = "adept/fuyu-8b"
allow = false

[[accessibility.proxy]]
repo = "mistralai/*"
allow = true

[[accessibility.proxy]]
repo = "mistralai/Mistral.*"
allow = false
use_re = true

# allow other or will be in whitelist mode.
[[accessibility.cache]]
repo = "*"
allow = true

[[accessibility.cache]]
repo = "*/*"
allow = true

[[accessibility.cache]]
repo = "cais/mmlu"
allow = true

[[accessibility.cache]]
repo = "adept/fuyu-8b"
allow = false

[performance]
# 64 MiB blocks — aligned with huggingface_hub / common Range clients
cache-block-size = "64MB"
# Faster gzip (level 1); use 4 for smaller disk at cost of CPU
cache-gzip-level = 1
# Idle timeout between upstream chunks while streaming large LFS files (seconds)
stream-read-timeout = 300
stream-connect-timeout = 30
remote-retry-max = 5
# Keep false when Olah sits behind nginx for long Range downloads
http2 = false
