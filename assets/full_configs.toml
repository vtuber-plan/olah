[basic]
host = "localhost"
port = 8090
ssl-key = ""
ssl-cert = ""
repos-path = "./repos"
cache-size-limit = ""
cache-clean-strategy = "LRU"
cache-compression = "none"
# Seconds a cached repo/revision metadata response (visibility probe,
# branch -> SHA resolution) is reused without revalidating against
# Hugging Face. Visibility depends on the caller's token, so it is only
# reused for the same caller. Model loads repeat these lookups per file
# and per worker, which can exhaust the Hub's API rate limit (1000
# requests / 5 minutes).
# 0 disables reuse: every request revalidates (pre-v0.5.3 behavior).
metadata-cache-ttl = 600
# Xet pass-through: let the client's hf_xet download Xet files >= the
# threshold directly from xethub.hf.co (hf_hub cannot fetch them over
# plain HTTP). Smaller Xet files still flow through the cache.
xet-passthrough = false
xet-passthrough-min-size = "50GB"
hf-scheme = "https"
hf-netloc = "huggingface.co"
hf-lfs-netloc = "cdn-lfs.huggingface.co"
mirror-scheme = "http"
mirror-netloc = "localhost:8090"
mirror-lfs-netloc = "localhost:8090"
mirrors-path = ["./mirrors_dir"]

[accessibility]
offline = false

# allow other or will be in whitelist mode.
[[accessibility.proxy]]
repo = "*"
allow = true

[[accessibility.proxy]]
repo = "*/*"
allow = true

[[accessibility.proxy]]
repo = "cais/mmlu"
allow = true

[[accessibility.proxy]]
repo = "adept/fuyu-8b"
allow = false

[[accessibility.proxy]]
repo = "mistralai/*"
allow = true

[[accessibility.proxy]]
repo = "mistralai/Mistral.*"
allow = false
use_re = true

# allow other or will be in whitelist mode.
[[accessibility.cache]]
repo = "*"
allow = true

[[accessibility.cache]]
repo = "*/*"
allow = true

[[accessibility.cache]]
repo = "cais/mmlu"
allow = true

[[accessibility.cache]]
repo = "adept/fuyu-8b"
allow = false
