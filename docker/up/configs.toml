[basic]
host = "0.0.0.0"
port = 8090
ssl-key = ""
ssl-cert = ""
repos-path = "/data/repos"
cache-size-limit = ""
cache-clean-strategy = "LRU"
cache-compression = "none"
# Xet pass-through: let the client's hf_xet download Xet files >= the
# threshold directly from xethub.hf.co (hf_hub cannot fetch them over
# plain HTTP). Smaller Xet files still flow through the cache.
xet-passthrough = false
xet-passthrough-min-size = "50GB"
hf-scheme = "https"
hf-netloc = "huggingface.co"
hf-lfs-netloc = "cdn-lfs.huggingface.co"
mirror-scheme = "http"
mirror-netloc = "localhost:8090"
mirror-lfs-netloc = "localhost:8090"
mirrors-path = ["/data/mirrors"]


[accessibility]
offline = false


[[accessibility.proxy]]
repo = "*"
allow = true

[[accessibility.proxy]]
repo = "*/*"
allow = true

[[accessibility.proxy]]
repo = "vikp/surya_det3"
allow = false

